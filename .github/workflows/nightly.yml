name: Nightly

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      # devkitA64 r29.2 / gcc 15.2.0 (see Makefile).
      image: devkitpro/devkita64:20260219

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Trust the workspace for git
        run: git config --global --add safe.directory '*'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
      
      - name: update Atmosphere-libs
        run: |
          pushd Atmosphere-libs
          git fetch --all
          git reset --hard origin/master
          popd

      - name: Build
        id: build
        run: make -j8 PREFIX="ccache aarch64-none-elf-"
        continue-on-error: true

      - name: Install libnx master & Retry build
        id: retry
        if: ${{ steps.build.outcome == 'failure' }}
        run: |
          pushd /tmp
          git clone https://github.com/switchbrew/libnx
          cd libnx
          make -j8 PREFIX="ccache aarch64-none-elf-"
          make install
          popd
          make -j8 PREFIX="ccache aarch64-none-elf-"

      - name: Upload built files
        uses: actions/upload-artifact@v7
        with:
          name: sdcard
          path: out/sd
          include-hidden-files: true

      - name: Upload ldn_mitm elf file
        uses: actions/upload-artifact@v7
        with:
          name: ldn_mitm.elf
          path: ldn_mitm/ldn_mitm.elf

      - name: Upload overlay elf file
        uses: actions/upload-artifact@v7
        with:
          name: overlay.elf
          path: overlay/overlay.elf
