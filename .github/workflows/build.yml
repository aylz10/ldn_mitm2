name: Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      # devkitA64 r29.2 / gcc 15.2.0 (see Makefile).
      image: devkitpro/devkita64:20260219

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          # git describe needs tags and full history.
          fetch-depth: 0

      - name: Trust the workspace for git
        run: git config --global --add safe.directory '*'

      - name: Toolchain versions
        continue-on-error: true
        run: |
          (dkp-pacman -Q 2>/dev/null || pacman -Q 2>/dev/null) \
            | grep -Ei 'devkita64|libnx|newlib|binutils' || true
          "${DEVKITPRO:-/opt/devkitpro}/devkitA64/bin/aarch64-none-elf-gcc" --version | head -1 || true
          git --version || true
          echo "version string this build will stamp:"
          echo "  $(git describe --tags 2>/dev/null)$(git diff --quiet --ignore-submodules=all HEAD 2>/dev/null || echo -dirty)"
          exit 0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Install latest libnx (before building)
        run: |
          pushd /tmp
          git clone https://github.com/switchbrew/libnx
          cd libnx
          make clean
          make -j8 PREFIX="ccache aarch64-none-elf-"
          make install
          popd

      - name: Clear invalid ccache after libnx update 
        run: ccache -C

      - name: Build
        run: make -j8 PREFIX="ccache aarch64-none-elf-"

      - name: Upload built files
        uses: actions/upload-artifact@v7
        with:
          name: sdcard
          path: out/sd
          # Hidden dirs (switch/.overlays) are skipped by default.
          include-hidden-files: true

      - name: Upload elf file
        uses: actions/upload-artifact@v7
        with:
          name: ldn_mitm.elf
          path: ldn_mitm/ldn_mitm.elf

      - name: Upload elf file
        uses: actions/upload-artifact@v7
        with:
          name: overlay.elf
          path: overlay/overlay.elf
